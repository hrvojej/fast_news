    skip_youtube: false
    max_youtube_videos: 5
    max_youtube_comments_per_video: 20
    max_reddit_posts: 5
    max_reddit_comments_per_post: 15
    min_comment_likes: 5
    min_comment_score: 10
    min_comment_words: 15
    authenticity_threshold: 0.6
    max_display_comments: 12

